# tickets.toml — povestile epicului „Catalogul se umple prin Claude”, în ordinea de construire.
# O singură linie de lucru (un singur autor). Firul de pornire = intrările 1–3.

[[entry]]
id = 1
type = "story"
title = "Scheletul proiectului"
description = "Creează proiectul cu create-electron-app@8.0.1 --template vite --typescript (template-ul vite-typescript nu mai există în Forge 8; asta închide întrebarea deschisă a epicului), adaugă React 19 (@vitejs/plugin-react, jsx react-jsx), structura de foldere din spine, Vitest, oxlint cu granițele hexagonului (AD-2), build-ul separat al CLI-ului în dist/cli (ESM) cu bin-ul whenkit expus prin npm link și convenția .env cu WHENKIT_WORKSPACE spre un workspace de dezvoltare încărcat cu --env-file; documentează în CLAUDE.md comenzile de build/test și faptul că terminalul din VS Code are ELECTRON_RUN_AS_NODE=1 (se pornește doar prin npm start)."
verify = "npm start deschide o fereastră goală, whenkit --version rulează dintr-un terminal nou, npm test și npm run lint trec."
covers = []
after = []
hitl = true
risk = "medium"
references = ["architecture-whenkit/architecture-whenkit.md#ad-1", "architecture-whenkit/architecture-whenkit.md#ad-19", "architecture-whenkit/reviews/review-versions.md"]

[[entry]]
id = 2
type = "story"
title = "Stocarea și workspace-ul"
description = "Porturile din core/ports.ts, Clock și IdGenerator, funcția comună de normalizare name_key, resolveWorkspace (AD-8), whenkit init minimal (foldere + config.json; refuză o cale din repo; nu scrie config.json când WHENKIT_WORKSPACE e setat), SqliteCatalogStore cu WAL/foreign_keys/busy_timeout, cadrul de migrări (schema_migrations cu sha256, backup înainte de migrare, BEGIN IMMEDIATE) și migrarea 0001 cu toată schema v1 din spine (inclusiv rejections, entries_fts cu triggere, meta.owner_id, categoriile de start semănate o dată), plus errors.ts și versions.ts."
verify = "Teste pe fișier temporar, cu APPDATA injectat: init creează workspace-ul și baza cu schema v1; redeschiderea nu re-migrează; o migrare cu hash schimbat oprește deschiderea; înainte de o a doua migrare de test apare backup-ul; o cale din repo e refuzată; cu WHENKIT_WORKSPACE setat, config.json nu se scrie."
covers = ["CAP-1"]
after = [1]
hitl = false
risk = "medium"
references = ["architecture-whenkit/architecture-whenkit.md#ad-4", "architecture-whenkit/architecture-whenkit.md#ad-5", "architecture-whenkit/architecture-whenkit.md#ad-8"]


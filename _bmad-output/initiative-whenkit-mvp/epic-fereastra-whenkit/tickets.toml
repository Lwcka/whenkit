[[entry]]
id = 5
type = "story"
title = "Fereastra vede importurile"
description = "Polling-ul PRAGMA data_version din main la câteva secunde și catalog:changed, plus helperul folosit de toate scrierile prin IPC care emite catalog:changed și întoarce EntryDto-urile schimbate; depozitul aplică aceste DTO-uri, reîncarcă instantaneul, îl înlocuiește întreg și clasifică sosirile și actualizările după id și revision, cu linia de bază o dată pe proces (AD-10); sosirile din vederea curentă aterizează cu entry-card-new și arrival-tape cu timp relativ, cardurile actualizate pulsează, contoarele cresc, section-header arată „· N nouă/noi”; toast-urile de sosire, câte unul pe zonă: mai multe fișe cu „Vezi” spre zona respectivă, o singură fișă cu numele și zona ei (acțiunea „Deschide” o adaugă intrarea 7)."
verify = "Teste: clasificarea sosire / actualizare / revizie mai mică, prima încărcare fără sosiri, propriile scrieri neclasificate ca externe, toast-urile unui lot în ordinea Toolbox, Learn; test de integrare în care o scriere de pe altă conexiune pe același fișier produce catalog:changed; manual, un whenkit import din terminal cu fereastra deschisă face fișa vizibilă în câteva secunde."
covers = ["CAP-8"]
after = [4]
hitl = true
risk = "high"
references = ["architecture-whenkit/architecture-whenkit.md#ad-10", "ux-whenkit/mockups/key-learn-import.html"]

[[entry]]
id = 6
type = "story"
title = "Căutarea text"
description = "Metoda de căutare din SqliteCatalogStore cu singura funcție care construiește interogarea FTS (fiecare token ca \"tok\"*, uniți cu AND, AD-5), cazul de utilizare și canalul entries:search care întorc id-urile potrivite, afișate în ordinea instantaneului (AD-10); search-box cu Ctrl+K/Ctrl+F și debounce, căutarea în zona curentă peste toate categoriile, textul păstrat la schimbarea zonei, section-header „Rezultate pentru …” cu linkul „+N în Learn”, empty-state cu trimiterea la /gaseste, golirea cu Esc care revine la categoria de dinainte, cascada rezultatelor și rularea din nou la catalog:changed."
verify = "Teste pe un catalog temporar: „fundal” găsește fișa prin cuvântul-cheie bilingv, „photopea” o găsește după nume, diacriticele și prefixele potrivesc, ghilimelele și operatorii FTS din text nu dau eroare; test de componentă pentru „+N în Learn”, ordinea rezultatelor și revenirea la categoria de dinainte."
covers = ["CAP-9"]
after = [5]
hitl = false
risk = "medium"
references = ["architecture-whenkit/architecture-whenkit.md#ad-5", "architecture-whenkit/architecture-whenkit.md#ad-10"]


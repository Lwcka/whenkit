# tickets.toml — poveștile epicului „Fereastra whenkit”, în ordinea de construire.
# O singură linie de lucru (un singur autor). Firul de pornire = intrarea 1.
# ipc.ts, preload, handlerii din main, ports.ts și SqliteCatalogStore sunt extinse de mai multe intrări, doar prin adăugare, în ordinea de mai jos.

[[entry]]
id = 1
type = "story"
title = "Firul de pornire: catalogul în fereastră"
description = "Main-ul rezolvă workspace-ul (AD-8) și deschide la pornire o singură conexiune SqliteCatalogStore într-un mod nou care scrie, dar nu migrează (migrări în așteptare ⇒ DATABASE_NEEDS_MIGRATION); cazul de utilizare catalogSnapshot din core citește într-o singură tranzacție toate fișele ambelor zone ca EntryDto și toate categoriile, în ordinea added_at DESC, seq ASC; src/shared/ipc.ts definește catalog:snapshot cu rezultatul { ok, data } | { ok: false, error } (AD-18), preload-ul expune window.whenkit, renderer-ul are depozitul unic al catalogului (forma lui se fixează aici, AD-10) și arată tab-urile Toolbox/Learn cu carduri simple; erorile de pornire din EXPERIENCE apar ca app-error; tot aici se fixează testarea renderer-ului (jsdom + Testing Library, vitest extins la .test.tsx), cu versiunile trecute în Stack."
verify = "Teste: snapshot-ul pe un catalog temporar întoarce ambele zone în ordinea AD-10; un workspace neconfigurat și o bază cu migrări în așteptare ajung în renderer ca WORKSPACE_NOT_CONFIGURED și DATABASE_NEEDS_MIGRATION, fără nicio scriere; manual, npm start pe workspace-ul de dezvoltare arată fișele importate în ambele tab-uri."
covers = ["CAP-8"]
after = ["1.3"]
hitl = true
risk = "medium"
references = ["architecture-whenkit/architecture-whenkit.md#ad-4", "architecture-whenkit/architecture-whenkit.md#ad-10", "architecture-whenkit/architecture-whenkit.md#ad-18", "ux-whenkit/EXPERIENCE.md#state-patterns"]

[[entry]]
id = 2
type = "story"
title = "Ciclul de viață al ferestrei"
description = "Partea din main a AD-20, fără salvarea notițelor la închidere: userData în desktop\\ sau desktop-dev\\ calculat din aceeași funcție ca config.json, instanță unică (a doua pornire aduce fereastra în față), window-state.json cu tema și poziția, dimensiunea minimă, tema aplicată nativ și trimisă prin additionalArguments, expusă de preload ca window.whenkit.initialTheme, window:setTheme; productName WhenKit, CSP fără surse externe, navigarea și window.open blocate (AD-9), erorile neprevăzute din main în dialog și în data/whenkit.log (AD-19)."
verify = "Teste pe logica din main: calea userData pentru aplicația instalată și pentru dezvoltare, window-state.json corupt sau cu bounds în afara ecranelor dă valorile implicite; manual: poziția se păstrează după repornire, a doua pornire aduce fereastra existentă în față, un link tras peste fereastră nu o navighează."
covers = ["CAP-8"]
after = [1]
hitl = true
risk = "medium"
references = ["architecture-whenkit/architecture-whenkit.md#ad-20", "architecture-whenkit/architecture-whenkit.md#ad-9", "architecture-whenkit/architecture-whenkit.md#ad-19"]

[[entry]]
id = 3
type = "story"
title = "Cadrul vizual: tokeni, temă, bare și scurtături"
description = "Tokenii din DESIGN.md ca variabile CSS pentru ambele teme sub [data-theme], pus înainte de createRoot din window.whenkit.initialTheme, Cascadia Mono inclus și lucide-react (versiuni în Stack); title-bar cu theme-switch, toolbar cu zone-tab (tablist, contoare live), status-bar cu „Catalog la zi”, numărul de fișe, ultima adăugată și calea workspace-ului tăiată la mijloc, plus indiciile de taste ale listei; componentele comune toast (informare și eroare, maximum 3, aria-live) și starea „în lucru” a butoanelor; formatele de dată și număr și pluralul românesc (Intl.PluralRules) în strings.ro.ts; stratul unic de scurtături după event.code, cu dispecerul pentru Esc în ordinea din EXPERIENCE și fără declanșare în câmpurile de text (Ctrl+1/2, zoom 80–200%); focus-ring doar la :focus-visible, ținte de minimum 24×24, prefers-reduced-motion urmărit live și comportamentul cadrului la lățimi mici."
verify = "Teste: pluralul dă „1 fișă”, „19 fișe”, „20 de fișe”, „101 fișe”; datele și numerele au formatele din EXPERIENCE; o tastă dintr-un caracter într-un câmp de text nu declanșează scurtătura; Esc respectă prioritatea; manual: tema aleasă se păstrează după repornire, prima pornire urmează tema Windows fără clipire, cadrul arată bine la 720 și 1200 px."
covers = ["CAP-8"]
after = [2]
hitl = true
risk = "medium"
references = ["ux-whenkit/DESIGN.md", "ux-whenkit/mockups/key-toolbox.html", "architecture-whenkit/architecture-whenkit.md#ad-20"]

[[entry]]
id = 4

title = "Răsfoirea pe categorii"
description = "category-bar cu „Toate” și categoriile zonei în ordine alfabetică românească, cu contoare (inclusiv 0), grup de selecție unică, derulare orizontală cu estompări și butoane ‹ ›, tastele [ și ], categoria ținută minte pe zonă cât e deschisă aplicația; section-header; entry-card complet după DESIGN.md (kind-stamp în Learn, category-tab cu culoarea din ordinea id-urilor, primele situații, verification-flag); grila auto-fill cu roving tabindex și săgeți; empty-state pentru catalog gol și categorie fără fișe, skeleton la pornire și cascada la schimbarea categoriei."
verify = "Teste de componentă: selectarea unei categorii arată doar fișele ei, o fișă cu două categorii apare în ambele, cardurile Learn au ștampila felului, ordinea și contoarele categoriilor sunt corecte; manual, pe catalogul de dezvoltare, la 720 și 1200 px."
